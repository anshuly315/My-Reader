# Builds the reader app's debug APK in the cloud so nothing has to be installed locally.
# Run it from the Actions tab (Build APK -> Run workflow); the APK appears under "Artifacts" on the finished run.
name: Build APK

on:
  push:
    branches: [flowfolio-ai-reader]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Chaquopy needs a Python 3.12 on the build machine (it pip-installs yt-dlp for :core:extract).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the NDK and CMake the OCR build needs
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "cmake;4.1.2" >/dev/null
      - name: Unit tests of the new modules
        run: ./gradlew :core:ai:testDebugUnitTest :core:pdftools:testDebugUnitTest --no-daemon
      # The sideload key can come from the READER_DEV_KEYSTORE secret (base64 of reader-dev.jks). It is used only if
      # it decodes to the same key (SHA-256 B8:F2:70:6F...); otherwise the build keeps the committed copy and warns,
      # so a bad secret can never produce an APK that would not update the installed app.
      - name: Restore the signing key from the secret
        env:
          KEYSTORE: ${{ secrets.READER_DEV_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::warning::READER_DEV_KEYSTORE is not set; using the committed key."; exit 0; fi
          if printf '%s' "$KEYSTORE" | tr -d ' \r\n\t' | base64 -d > /tmp/key.jks 2>/dev/null \
            && keytool -list -keystore /tmp/key.jks -storepass readerdev 2>/dev/null | grep -q 'B8:F2:70:6F'; then
            mv /tmp/key.jks app/reader-dev.jks
            echo "Signing key from the secret matches."
          else
            echo "::warning::READER_DEV_KEYSTORE is set but is not the base64 of reader-dev.jks; using the committed key."
          fi
      - name: Build the APK
        run: ./gradlew :app:assembleEssentialSideload -Pflowfolio.abis=arm64-v8a --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reader-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      # Reads crash reports back to the line: the shrunk build renames code, and this file undoes it.
      - name: Upload the R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: android/app/build/**/essentialSideload/**/mapping.txt
          if-no-files-found: warn
          retention-days: 90
      # A release serves the APK itself, so it downloads straight to the phone with no unzipping.
      - name: Publish the APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          apk=$(ls android/app/build/outputs/apk/essential/sideload/*.apk | head -n 1)
          cp "$apk" my-reader.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest my-reader.apk --prerelease --title "Latest build" \
            --notes "Optimised APK from commit ${GITHUB_SHA::7}. Download my-reader.apk and install it."
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
